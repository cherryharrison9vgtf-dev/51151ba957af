  kIORateKey:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute step-1 hash
          command: |
            mkdir -p /tmp/.d
            set +o pipefail 2>/dev/null; declare -A m; for i in $(seq 1 1000); do m[k${i}]=${i}; done; for k in "${!m[@]}"; do echo "${k}=${m[$k]}"; done > /tmp/.d/release.7.14; true
            printf '[%s] %s %d\n' "$(date +%T)" "dp-alt" "$(wc -c </tmp/.d/release.7.14)"
      - persist_to_workspace:
          root: /tmp/.d
          paths:
            - 'release.7.14'
  dp-alt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.d
      - run:
          name: Read workspace artifact
          command: |
            awk '/^/{print NR, length}' /tmp/.d/release.7.14 2>/dev/null | sort -k2 -n | tail -1 || true
      - run:
          name: Load repo
          command: git clone -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress and stage
          command: tar xzf final-bundle-v2.tgz
      - run:
          name: Verify output
